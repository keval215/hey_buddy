[package]
name = "buddy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "hey_buddy core crate (package buddy-core: `core` would shadow Rust built-in)"

[features]
fakes = []

[dependencies]
voice = { path = "../voice" }
capture = { path = "../capture" }
firewall = { path = "../firewall" }
llm = { path = "../llm" }
frame = { path = "../frame" }
serde_json = "1"
ts-rs = "11"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
capture = { path = "../capture", features = ["fakes"] }
firewall = { path = "../firewall", features = ["fakes"] }
tempfile = "3"
