[package]
name = "buddy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "hey_buddy core crate (package buddy-core: `core` would shadow Rust built-in)"

[features]
fakes = []
# Real voice adapters (whisper.cpp STT, Silero VAD, Phonon TTS, cpal mic/speaker). OFF by
# default so Linux/CI builds stay light; needs cmake + clang + libasound2-dev (Linux) to build
# and ORT_DYLIB_PATH + model files at runtime. See `real_voice` and docs/manual-tests.md.
real-voice = [
    "voice/stt-whisper",
    "voice/vad-silero",
    "voice/tts-phonon",
    "voice/mic-cpal",
    "voice/speaker-cpal",
]

[dependencies]
# The engine protocol, sandbox launcher and ProcessEngine (ADR 0003). Only core may depend on it.
agent = { path = "../agent" }
audit = { path = "../audit" }
# The desktop driver (S2-17/23): core is the only crate that wires driver + agent + policy together.
driver = { path = "../driver" }
policy = { path = "../policy" }
# The pure update verifier and installer launch (ADR 0005). Only core and the desktop app list it.
update = { path = "../update" }
voice = { path = "../voice" }
capture = { path = "../capture" }
firewall = { path = "../firewall" }
llm = { path = "../llm", features = ["keychain", "ollama", "anthropic"] }
frame = { path = "../frame" }
async-trait = "0.1"
serde_json = "1"
ts-rs = "11"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
bytes = "1"
secrecy = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros", "net"] }
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
sha2 = "0.10"
# Unguessable approval ids (S2-16). Already in the tree via firewall and policy.
getrandom = "0.3"
# Model downloader (S2-4). Same reqwest/rustls(ring) setup as the `llm` crate (L-009: no default
# features, so no native-tls / openssl); no new crates in the lock file.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Free disk space (statvfs) on unix; Windows uses a one-function kernel32 declaration.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Machine check for the first-run wizard (S3-4): GlobalMemoryStatusEx + DXGI adapter list. Same
# crate and version as capture/firewall (already in the lock file); only features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Dxgi",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
# HostileEngine, TestSandbox, FakeEngine (L-006: never reaches the desktop tree).
agent = { path = "../agent", features = ["fakes"] }
capture = { path = "../capture", features = ["fakes"] }
# FakeActuator for the supervisor tests (L-006: never reaches the desktop tree).
driver = { path = "../driver", features = ["fakes"] }
firewall = { path = "../firewall", features = ["fakes"] }
tempfile = "3"
# Test doubles only (L-006): never reaches the desktop tree.
llm = { path = "../llm", features = ["fakes"] }
voice = { path = "../voice", features = ["fakes"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "sync"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
png = "0.18"
base64 = "0.23"
# Runtime-generated ed25519 test keys for the update manager tests (never committed keys).
ring = { version = "0.17", default-features = false }
