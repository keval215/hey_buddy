[package]
name = "capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "hey_buddy capture crate: CaptureSource trait, platform impls, app deny-list"

[features]
fakes = []

[dependencies]
frame = { path = "../frame" }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform deps are target-gated so Linux builds never see them (L-009).
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
