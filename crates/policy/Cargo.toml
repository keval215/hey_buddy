[package]
name = "policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "hey_buddy policy (ADR 0003 sections 4-9): plan validation, tier classification, PolicyGate, sealed ApprovedAction, kill switch (pure, sync)"

[features]
# Test helpers (BoundStepFacts::assume_benign_environment). Off by default; never enable outside tests.
test-support = []

[dependencies]
action = { path = "../action" }
firewall = { path = "../firewall" }
getrandom = "0.3"
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
policy = { path = ".", features = ["test-support"] }
# Real Observations for binding/gate tests come from the firewall fakes (test-only; never in the normal tree).
firewall = { path = "../firewall", features = ["fakes"] }
frame = { path = "../frame" }
# The real file sink is exercised against a real gate in tests/audit_file.rs (integration test only:
# it links the same `policy` as `audit`; never in the normal tree).
audit = { path = "../audit" }
tempfile = "3"
