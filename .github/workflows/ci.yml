name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (Tauri embeds dist)
        run: pnpm --filter desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: ADR 0001 - llm must not depend on capture
        run: |
          if cargo tree -p llm | grep -E '(^|[^a-z_-])capture '; then
            echo "llm depends on capture"; exit 1
          fi
      - name: ADR 0001 - fakes feature must not be enabled in desktop app tree
        run: |
          if cargo tree -p desktop -e features | grep -E 'feature "fakes"'; then
            echo "fakes feature enabled in desktop tree"; exit 1
          fi
      - name: Licence check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (Tauri embeds dist)
        run: pnpm --filter desktop build
      - run: cargo check --workspace
      - name: Tauri build
        run: pnpm --filter desktop tauri build --no-bundle
